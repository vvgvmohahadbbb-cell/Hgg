<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark"><title>باني الألعاب</title>
<style>
:root{--bg:#0f1424;--card:#1a2238;--line:#2a3452;--txt:#eef1fb;--mut:#9aa6c7;--a:#4f8cff;--b:#7c5cff;--ok:#2ecc8f;--bad:#ff6b6b}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.7 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:max(16px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
h1{margin:6px 0 0;font-size:24px}.sub{margin:0 0 14px;color:var(--mut);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
label{display:block;margin:8px 0 4px;color:var(--mut);font-size:13px}
input{width:100%;background:#0f1424;color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;direction:ltr;text-align:left}
#nm{direction:rtl;text-align:right}
.btn{display:block;width:100%;margin-top:10px;border:0;border-radius:14px;padding:14px;font:600 17px inherit;color:#fff;background:linear-gradient(90deg,var(--a),var(--b))}
.btn.s{background:#2a3452;font-size:15px;padding:11px}.btn:disabled{opacity:.5}
.bar{height:8px;background:#0f1424;border-radius:8px;overflow:hidden;margin-top:12px;display:none}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .3s}
.st{margin-top:8px;font-size:14px;color:var(--mut);min-height:22px;word-break:break-word}.st.bad{color:var(--bad)}.st.ok{color:var(--ok)}
.h{border-top:1px solid var(--line);padding:10px 0}.h:first-child{border-top:0}.h small{color:var(--mut)}
.row{display:flex;gap:8px}.row .btn{margin-top:8px}
summary{font-weight:600;cursor:pointer}small.t{color:var(--mut);display:block;margin-top:6px;font-size:12px;line-height:1.6}
</style></head><body>
<h1>📦 باني الألعاب</h1><p class="sub">اختر أي ZIP (ويب، Godot 4، Flutter، Android Studio)، يرفعه ويبنيه APK</p>
<div class="card">
<label>اسم التطبيق (اختياري)</label><input id="nm" placeholder="لو تركته فاضي ياخذ اسم الملف" maxlength="30">
<button class="btn" id="pick" onclick="document.getElementById('zf').click()">📦 اختر ZIP</button>
<input id="zf" type="file" accept=".zip,application/zip,application/x-zip-compressed" hidden onchange="onPick(this)">
<div class="bar" id="bar"><i id="pb"></i></div><div class="st" id="st"></div><div id="res"></div></div>
<div class="card"><b>🕘 آخر البناءات</b><div id="hist"><small class="t">ما في شي لسا</small></div></div>
<details class="card" id="set"><summary>⚙️ الإعدادات</summary>
<label>GitHub Token</label><input id="tok" type="password" autocomplete="off" placeholder="ghp_… أو github_pat_…">
<label>المستودع</label><input id="repo" placeholder="owner/repo">
<div class="row"><button class="btn s" onclick="saveSet()">💾 حفظ</button><button class="btn s" onclick="testSet()">🔌 اختبار</button></div>
<small class="t">التوكن بيتخزّن على جهازك فقط. نفس توكن السكربت يصلح. الصلاحيات: classic = repo + workflow، أو fine-grained = Contents وActions (قراءة وكتابة) على المستودع.</small></details>
<script>
//==CORE==
const sleep=ms=>new Promise(z=>setTimeout(z,ms));
async function ghCall(cfg,path,method,body){
  let er;
  for(let t=0;t<3;t++){
    let r;
    try{r=await fetch('https://api.github.com/repos/'+cfg.repo+path,{method:method||'GET',headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:body?JSON.stringify(body):undefined})}
    catch(e){er=new Error('ما في اتصال بالنت');await sleep(1500);continue}
    if(r.status===204)return {};
    const j=await r.json().catch(()=>({}));
    if(r.ok)return j;
    if(r.status>=500||r.status===429){er=new Error('GitHub مشغول ('+r.status+')');await sleep(2000);continue}
    throw new Error(r.status===401?'التوكن غلط أو منتهي':r.status===404?'ما لقيت المستودع أو الملف، أو التوكن بلا صلاحية (لازم repo وworkflow)':(j.message||('خطأ '+r.status)))}
  throw er}
async function zipRead(buf){
  const dv=new DataView(buf),u8=new Uint8Array(buf);let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){if(dv.getUint32(i,true)===0x06054b50){e=i;break}}
  if(e<0)throw new Error('ملف ZIP غير صالح');
  const n=dv.getUint16(e+10,true);let p=dv.getUint32(e+16,true);const td=new TextDecoder(),out=[];
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50)throw new Error('ملف ZIP تالف');
    const fl=dv.getUint16(p+8,true),met=dv.getUint16(p+10,true),csz=dv.getUint32(p+20,true),nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true),lo=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl)).replace(/\\/g,'/');p+=46+nl+xl+cl;
    if(name.endsWith('/'))continue;
    if(fl&1)throw new Error('الـ ZIP مشفّر بكلمة سر، غير مدعوم');
    const ds=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    out.push({name,met,raw:u8.subarray(ds,ds+csz)})}
  return out}
async function zipInflate(x){
  if(x.met===0)return x.raw;
  if(x.met!==8)throw new Error('طريقة ضغط غير مدعومة');
  if(!window.DecompressionStream)throw new Error('جهازك ما يدعم فك الضغط');
  return new Uint8Array(await new Response(new Blob([x.raw]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}
const b64=u=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(String(r.result).split(',')[1]||'');r.onerror=()=>no(new Error('تعذّرت القراءة'));r.readAsDataURL(new Blob([u]))});
function prepList(entries){
  let list=entries.filter(x=>x.name&&!/(^|\/)(__MACOSX|\.DS_Store|Thumbs\.db)(\/|$)/i.test(x.name)&&!/(^|\/)\.(git|github|godot|gradle|idea|dart_tool)(\/|$)/i.test(x.name)&&!/(^|\/)local\.properties$/.test(x.name)&&!/(^|\/)\.\.?(\/|$)/.test(x.name)&&!x.name.startsWith('/'));
  const depth=x=>x.name.split('/').length;
  const strip=(m,len)=>{const pre=m.name.slice(0,-len);list=list.filter(x=>x.name.startsWith(pre));list.forEach(x=>x.name=x.name.slice(pre.length))};
  const find=re=>list.filter(x=>re.test(x.name)).sort((a,b)=>depth(a)-depth(b))[0];
  let m=find(/(^|\/)project\.godot$/);
  if(m){strip(m,13);return {list,kind:'godot'}}
  m=find(/(^|\/)pubspec\.yaml$/);
  if(m){strip(m,12);list=list.filter(x=>!/^build\//.test(x.name));return {list,kind:'flutter'}}
  m=find(/(^|\/)(settings\.gradle(\.kts)?|gradlew)$/);
  if(m){strip(m,m.name.split('/').pop().length);list=list.filter(x=>!/^(app\/)?build\//.test(x.name));return {list,kind:'gradle'}}
  m=find(/(^|\/)index\.html$/);
  if(m){strip(m,10);return {list,kind:'web'}}
  m=find(/\.html?$/i);
  if(m){strip(m,m.name.split('/').pop().length);const h=list.find(x=>/\.html?$/i.test(x.name)&&x.name.indexOf('/')<0);if(h)h.name='index.html';return {list,kind:'web'}}
  throw new Error('ما عرفت نوع المشروع. المدعوم: لعبة ويب (html)، Godot 4 (project.godot)، Flutter (pubspec.yaml)، مشروع Android Studio (gradlew أو settings.gradle)')}
async function uploadZip(cfg,buf,name,say){
  say('📦 يقرأ الملف…',2);
  const pl=prepList(await zipRead(buf)),list=pl.list,kind=pl.kind;
  let gv='';
  if(kind==='godot'){
    const pt=new TextDecoder().decode(await zipInflate(list.find(x=>x.name==='project.godot')));
    const cv=+((pt.match(/config_version\s*=\s*(\d+)/)||[])[1]||5);
    if(cv<5)throw new Error('هذا مشروع Godot 3، المدعوم Godot 4 فقط');
    gv=((pt.match(/config\/features\s*=\s*PackedStringArray\(\s*"(\d+\.\d+)"/)||[])[1]||'4.3')+'.0';
    say('🎮 مشروع Godot '+gv.slice(0,-2)+' — '+list.length+' ملف',3)}
  else say('🔎 النوع: '+({flutter:'Flutter',gradle:'Android Studio',web:'ويب'}[kind])+' — '+list.length+' ملف',3);
  const nm=String(name||'').replace(/[^\p{L}\p{N} _-]/gu,'').trim().slice(0,30)||'game';
  const slug='g'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);
  say('🔎 يتحقق من المستودع…',4);
  const branch=(await ghCall(cfg,'','GET')).default_branch;
  const head=(await ghCall(cfg,'/git/ref/heads/'+branch)).object.sha;
  const baseTree=(await ghCall(cfg,'/git/commits/'+head)).tree.sha;
  const tree=new Array(list.length);let done=0,idx=0;
  const worker=async()=>{while(idx<list.length){const i=idx++,x=list[i];
    const bl=await ghCall(cfg,'/git/blobs','POST',{content:await b64(await zipInflate(x)),encoding:'base64'});
    tree[i]={path:'games/'+slug+'/'+x.name,mode:'100644',type:'blob',sha:bl.sha};done++;
    say('📤 يرفع '+done+'/'+list.length,6+74*done/list.length)}};
  await Promise.all([worker(),worker(),worker()]);
  say('🧱 يجهّز الالتزام…',82);
  const tr=await ghCall(cfg,'/git/trees','POST',{base_tree:baseTree,tree});
  const cm=await ghCall(cfg,'/git/commits','POST',{message:'game '+slug,tree:tr.sha,parents:[head]});
  await ghCall(cfg,'/git/refs/heads/'+branch,'PATCH',{sha:cm.sha});
  say('🚀 يشغّل البناء…',90);
  const ts=Date.now(),wf={godot:'godot-apk.yml',flutter:'flutter-apk.yml',gradle:'gradle-apk.yml',web:'game-apk.yml'}[kind];
  try{await ghCall(cfg,'/actions/workflows/'+wf+'/dispatches','POST',{ref:branch,inputs:kind==='godot'?{slug,name:nm,godot:gv}:{slug,name:nm}})}
  catch(e){throw new Error(e.message+' — تأكد إن ملف '+wf+' موجود بالمستودع')}
  return {slug,name:nm,ts,files:list.length,wf,kind}}
async function waitBuild(cfg,h,say){
  const end=Date.now()+30*60000;
  while(Date.now()<end){
    await sleep(8000);
    try{const r=await ghCall(cfg,'/releases/tags/'+h.slug);const a=(r.assets||[]).find(x=>/\.apk$/i.test(x.name));if(a){h.url=a.browser_download_url;return h}}catch(e){}
    let st='⏳ بانتظار بدء البناء…';
    try{const rs=await ghCall(cfg,'/actions/workflows/'+(h.wf||'game-apk.yml')+'/runs?event=workflow_dispatch&per_page=10');
      const run=(rs.workflow_runs||[]).filter(x=>Date.parse(x.created_at)>=h.ts-20000).sort((a,b)=>Date.parse(a.created_at)-Date.parse(b.created_at))[0];
      if(run){
        if(run.status==='completed'&&run.conclusion!=='success'){h.err=run.html_url;throw new Error('فشل البناء ('+run.conclusion+'). السجل: '+run.html_url)}
        st=run.status==='in_progress'?'🏗️ يبني التطبيق…':'⏳ بالطابور…'}}
    catch(e){if(/فشل البناء/.test(e.message))throw e}
    say(st+' ('+Math.round((Date.now()-h.ts)/1000)+' ث)')}
  throw new Error('تأخر البناء كتير، افتح Actions بـ GitHub وشوف')}
//==UI==
const $=id=>document.getElementById(id);
const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const cfg=()=>({token:String(LS.get('tok','')).trim(),repo:String(LS.get('repo','vvgvmohahadbbb-cell/Videooo')).trim()});
function say(t,p,cls){const s=$('st');s.textContent=t;s.className='st'+(cls?' '+cls:'');if(p!=null){$('bar').style.display='block';$('pb').style.width=Math.max(0,Math.min(100,p))+'%'}}
function openUrl(u){const B=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.Browser;if(B){B.open({url:u}).catch(()=>window.open(u,'_blank'))}else window.open(u,'_blank')}
async function copyUrl(u){try{await navigator.clipboard.writeText(u);say('✅ نسخت الرابط، الصقه بالمتصفح',null,'ok')}catch(e){say('الرابط: '+u)}}
function showRes(h){
  const r=$('res');r.innerHTML='';
  if(!h||!h.url)return;
  const a=document.createElement('button');a.className='btn';a.textContent='📲 حمّل وثبّت «'+h.name+'»';a.onclick=()=>openUrl(h.url);
  const b=document.createElement('button');b.className='btn s';b.textContent='🔗 نسخ رابط التحميل';b.onclick=()=>copyUrl(h.url);
  r.append(a,b)}
function hist(){return LS.get('hist',[])}
function renderHist(){
  const H=hist(),box=$('hist');box.innerHTML='';
  if(!H.length){box.innerHTML='<small class="t">ما في شي لسا</small>';return}
  H.forEach((h,i)=>{
    const d=document.createElement('div');d.className='h';
    const t=document.createElement('div');t.innerHTML='<b></b> <small></small>';t.firstChild.textContent=h.name;t.lastChild.textContent=new Date(h.ts).toLocaleString('ar')+' · '+(h.url?'جاهز':h.err?'فشل':'قيد البناء');
    d.append(t);
    const r=document.createElement('div');r.className='row';
    const mk=(txt,fn)=>{const b=document.createElement('button');b.className='btn s';b.textContent=txt;b.onclick=fn;r.append(b)};
    if(h.url){mk('📲 تحميل',()=>openUrl(h.url));mk('🔗 نسخ',()=>copyUrl(h.url))}
    else if(h.err)mk('📄 السجل',()=>openUrl(h.err));
    else mk('🔄 تابع',()=>resume(i));
    mk('🗑️',()=>{const x=hist();x.splice(i,1);LS.set('hist',x);renderHist()});
    d.append(r);box.append(d)})}
function saveH(h){const x=hist().filter(y=>y.slug!==h.slug);x.unshift(h);LS.set('hist',x.slice(0,15));renderHist()}
function busy(b){$('pick').disabled=b}
async function track(h){
  try{await waitBuild(cfg(),h,(t)=>say(t,95));saveH(h);say('✅ التطبيق جاهز!',100,'ok');showRes(h)}
  catch(e){saveH(h);say('⚠️ '+e.message,null,'bad')}
  busy(false)}
async function resume(i){const h=hist()[i];if(!h)return;busy(true);$('res').innerHTML='';h.err='';say('🔄 يتابع…',95);await track(h)}
async function onPick(inp){
  const f=inp.files&&inp.files[0];inp.value='';if(!f)return;
  const c=cfg();
  if(!c.token||!/^[\w.-]+\/[\w.-]+$/.test(c.repo)){$('set').open=true;say('⚠️ حط التوكن واسم المستودع بالإعدادات أولاً',null,'bad');return}
  busy(true);$('res').innerHTML='';
  try{
    const h=await uploadZip(c,await f.arrayBuffer(),$('nm').value||f.name.replace(/\.zip$/i,''),say);
    saveH(h);await track(h)}
  catch(e){say('⚠️ '+e.message,null,'bad');busy(false)}}
function saveSet(){LS.set('tok',$('tok').value.trim());LS.set('repo',$('repo').value.trim());say('✅ انحفظت الإعدادات',null,'ok')}
async function testSet(){
  saveSet();const c=cfg();say('🔌 يختبر…');
  try{const r=await ghCall(c,'','GET');say(r.permissions&&r.permissions.push===false?'⚠️ الاتصال شغّال لكن التوكن بدون صلاحية كتابة':'✅ الاتصال شغّال ('+r.full_name+')',null,r.permissions&&r.permissions.push===false?'bad':'ok')}
  catch(e){say('⚠️ '+e.message,null,'bad')}}
$('tok').value=LS.get('tok','');$('repo').value=LS.get('repo','vvgvmohahadbbb-cell/Videooo');
if(!cfg().token)$('set').open=true;
renderHist();
</script></body></html>
