name: Android Studio APK
on:
  workflow_dispatch:
    inputs:
      slug: {required: true}
      name: {required: true}
permissions: {contents: write}
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SLUG: ${{ inputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: build
        working-directory: games/${{ inputs.slug }}
        run: |
          if [ -f gradlew ]; then chmod +x gradlew; ./gradlew assembleDebug --no-daemon
          else gradle assembleDebug --no-daemon; fi
          APK=$(find . -path '*outputs/apk/debug/*.apk' | head -1)
          test -n "$APK"
          cp "$APK" "$GITHUB_WORKSPACE/game.apk"
      - uses: softprops/action-gh-release@v2
        with: {tag_name: "${{ inputs.slug }}", files: game.apk}
