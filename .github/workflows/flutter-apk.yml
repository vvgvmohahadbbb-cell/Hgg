name: Flutter APK
on:
  workflow_dispatch:
    inputs:
      slug: {required: true}
      name: {required: true}
permissions: {contents: write}
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SLUG: ${{ inputs.slug }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - uses: subosito/flutter-action@v2
        with: {channel: stable}
      - name: build
        working-directory: games/${{ inputs.slug }}
        run: |
          [ -d android ] || flutter create . --platforms=android
          flutter pub get
          flutter build apk --debug
          cp build/app/outputs/flutter-apk/app-debug.apk "$GITHUB_WORKSPACE/game.apk"
      - uses: softprops/action-gh-release@v2
        with: {tag_name: "${{ inputs.slug }}", files: game.apk}
