name: ZipApp APK
on:
  workflow_dispatch:
  push:
    paths: ['zipapp/**', '.github/workflows/zipapp-apk.yml']
permissions: {contents: write}
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 21}
      - name: مفتاح التوقيع الثابت
        env:
          KS: ${{ secrets.DEBUG_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then mkdir -p ~/.android && echo "$KS" | base64 -d > ~/.android/debug.keystore; fi
      - run: mkdir g && cp zipapp/index.html g/index.html
      - run: npm init -y >/dev/null && npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/browser
      - run: npx cap init "باني الألعاب" "com.qasim.zipbuilder" --web-dir g
      - run: npx cap add android && npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk zip-builder.apk
      - uses: softprops/action-gh-release@v2
        with: {tag_name: "zipapp", files: zip-builder.apk}
